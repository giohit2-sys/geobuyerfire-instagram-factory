[project]
name = "geobuyerfire-instagram-factory"
version = "0.1.0"
description = "Automated original Instagram carousel factory for Geo Buyer Fire"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "imageio-ffmpeg>=0.5"]

[project.scripts]
ig-factory = "instagram_factory.cli:main"

[tool.setuptools.packages.find]
include = ["instagram_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
