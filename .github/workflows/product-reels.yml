name: Buyer Fire product Reels
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
concurrency:
  group: geobuyerfire-instagram-factory
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_API_HOST: https://graph.instagram.com
      INSTAGRAM_API_VERSION: v26.0
      PUBLIC_ASSET_BASE_URL: https://raw.githubusercontent.com/giohit2-sys/geobuyerfire-instagram-factory/main
      RUNTIME_KEY: ${{ secrets.RUNTIME_KEY }}
      TIMEZONE: Europe/Moscow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configure state persistence
        run: |
          git config user.name instagram-factory-bot
          git config user.email instagram-factory-bot@users.noreply.github.com
      - name: Install existing factory dependencies
        run: python -m pip install .
      - name: Restore product Insights
        run: |
          export INSIGHTS_CIPHER_KEY="${RUNTIME_KEY:-$INSTAGRAM_ACCESS_TOKEN}"
          if [ -f product_insights.json.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in product_insights.json.enc -out product_insights.json -pass env:INSIGHTS_CIPHER_KEY
          fi
      - name: Publish one approved product Reel and collect Insights
        run: python product_factory.py
      - name: Persist encrypted product Insights
        if: always()
        run: |
          export INSIGHTS_CIPHER_KEY="${RUNTIME_KEY:-$INSTAGRAM_ACCESS_TOKEN}"
          if [ -f product_insights.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -in product_insights.json -out product_insights.json.enc -pass env:INSIGHTS_CIPHER_KEY
            git add product_insights.json.enc
            git diff --cached --quiet || git commit -m "chore: product Insights"
            git push origin HEAD:main
          fi
