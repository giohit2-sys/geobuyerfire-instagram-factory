name: Instagram content factory

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

concurrency:
  group: geobuyerfire-instagram-factory
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_API_HOST: https://graph.instagram.com
      INSTAGRAM_API_VERSION: v26.0
      PUBLIC_ASSET_BASE_URL: https://raw.githubusercontent.com/giohit2-sys/geobuyerfire-instagram-factory/main
      AUTOPUBLISH_ENABLED: "true"
      TIMEZONE: Europe/Moscow
      RUNTIME_KEY: ${{ secrets.RUNTIME_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy scheduled content bundle
        shell: bash
        run: |
          shopt -s nullglob
          parts=(hf72-deploy.zip.part-*)
          if [ -f hf72-deploy.zip.part-07 ] && [ ${#parts[@]} -eq 8 ]; then
            cat "${parts[@]}" > /tmp/hf72-deploy.zip
            unzip -o /tmp/hf72-deploy.zip
            git checkout -- .github/workflows/instagram-factory.yml
            git config user.name "instagram-factory-bot"
            git config user.email "instagram-factory-bot@users.noreply.github.com"
            git add data/queue.json instagram_factory pyproject.toml tests tools published
            git rm -f "${parts[@]}"
            git diff --cached --quiet || git commit -m "chore: deploy 72-hour carousel experiment"
            git push
          elif [ ${#parts[@]} -gt 0 ]; then
            echo "Deployment bundle is incomplete; waiting for all 8 parts." >&2
            exit 1
          fi
      - name: Unpack initial deployment
        shell: bash
        run: |
          if [ -f geobuyerfire-deploy.zip ] && [ ! -d instagram_factory ]; then
            unzip -o geobuyerfire-deploy.zip
            git config user.name "instagram-factory-bot"
            git config user.email "instagram-factory-bot@users.noreply.github.com"
            git add README.md pyproject.toml .env.example instagram_factory tests data assets published .github/workflows/instagram-factory.yml
            git diff --cached --quiet || git commit -m "chore: unpack Instagram factory"
            git push
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Restore encrypted Insights history
        shell: bash
        run: |
          export INSIGHTS_CIPHER_KEY="${RUNTIME_KEY:-$INSTAGRAM_ACCESS_TOKEN}"
          if [ -f data/insights.json.enc ]; then
            if [ -n "$INSIGHTS_CIPHER_KEY" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -in data/insights.json.enc -out data/insights.json -pass env:INSIGHTS_CIPHER_KEY
              chmod 600 data/insights.json
            fi
          fi
      - name: Test and render
        run: |
          python -m unittest discover -v
          python -m instagram_factory.cli render
      - name: Publish public assets before Meta fetches them
        shell: bash
        run: |
          git config user.name "instagram-factory-bot"
          git config user.email "instagram-factory-bot@users.noreply.github.com"
          git add data/queue.json published
          git diff --cached --quiet || git commit -m "chore: render Instagram queue"
          git push
      - name: Publish at most one due carousel
        run: python -m instagram_factory.cli publish-due
      - name: Collect due Instagram Insights snapshots
        run: python -m instagram_factory.cli collect-insights
      - name: Persist queue state and encrypted Insights
        if: always()
        shell: bash
        run: |
          export INSIGHTS_CIPHER_KEY="${RUNTIME_KEY:-$INSTAGRAM_ACCESS_TOKEN}"
          if [ -n "$INSIGHTS_CIPHER_KEY" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -in data/insights.json -out data/insights.json.enc -pass env:INSIGHTS_CIPHER_KEY
            git add data/insights.json.enc
          fi
          rm -f data/insights.json
          git add data/queue.json
          git add -u data/insights.json
          git diff --cached --quiet || git commit -m "chore: update Instagram queue"
          git push
